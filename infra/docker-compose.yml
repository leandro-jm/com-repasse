# =============================================================================
# Stack de PRODUÇÃO (VPS + Portainer) — usa imagens do Docker Hub (PULL).
# Build/push das imagens:  ./build-push.sh   (ver docker-compose.build.yml)
#
# Arquitetura: web (nginx) serve a SPA e faz proxy de /api → api (MESMA ORIGEM).
# A API não expõe porta pública; só é acessível via proxy do web. O worker roda
# as campanhas. Evolution API é EXTERNO: a conexão é por tenant (whatsapp_instances).
#
# Envs: copie deploy.env.example → .env (ao lado deste arquivo) e preencha.
# No Portainer, informe as mesmas variáveis no formulário do stack.
# =============================================================================
services:
  web:
    image: ${REGISTRY:-31.220.95.65:5000}/crm-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    environment:
      # backend na mesma rede; troque só se a API mudar de nome/porta
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8787}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: ${REGISTRY:-31.220.95.65:5000}/crm-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # sem `ports`: a API só é acessível pelo proxy do web (same-origin)
    environment:
      NODE_ENV: production
      API_PORT: 8787
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: ${REGISTRY:-31.220.95.65:5000}/crm-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      CAMPAIGN_THROTTLE_MIN_MS: ${CAMPAIGN_THROTTLE_MIN_MS:-4000}
      CAMPAIGN_THROTTLE_MAX_MS: ${CAMPAIGN_THROTTLE_MAX_MS:-12000}
